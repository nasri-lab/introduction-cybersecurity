name: lab7

services:
  serveur:
    build: ./serveur
    container_name: serveur
    hostname: serveur
    cap_add:
      - NET_ADMIN                       # iptables, ARP statique, WireGuard
    networks:
      lan:
        ipv4_address: 10.10.0.10
    volumes:
      - ./serveur:/app:ro
    sysctls:
      # Volontairement vulnérable pour l'exercice 1 (corrigé à l'exercice 2, étape 3)
      net.ipv4.tcp_syncookies: "0"
      net.ipv4.tcp_max_syn_backlog: "128"
    # Exercice 2, étape 4.2 : ajouter ici le bloc « command »

  victime:
    build: ./victime
    container_name: victime
    hostname: victime
    cap_add:
      - NET_ADMIN
    networks:
      lan:
        ipv4_address: 10.10.0.20
    volumes:
      - ./victime:/app:ro
    depends_on:
      - serveur

  attaquant:
    build: ./attaquant
    container_name: attaquant
    hostname: attaquant
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      lan:
        ipv4_address: 10.10.0.66
    sysctls:
      net.ipv4.ip_forward: "1"
    volumes:
      - ./captures:/captures

  # Sonde de capture branchée sur le switch virtuel (port miroir), lancée à la demande
  sonde:
    build: ./attaquant
    profiles: ["outils"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures

  # Exercice 2, étape 1 : IDS en dérivation sur le switch virtuel
  ids:
    build: ./suricata
    profiles: ["ids"]
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/rules:/rules:ro
      - ./logs/ids:/var/log/suricata
    command: suricata -S /rules/local.rules -i br-lab -k none

  # Exercice 2, étape 2 : IPS en coupure, partage la pile réseau du serveur
  ips:
    build: ./suricata
    profiles: ["ips"]
    network_mode: "service:serveur"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./suricata/rules:/rules:ro
      - ./logs/ips:/var/log/suricata
    command: >
      sh -c "iptables -C INPUT -p tcp -j NFQUEUE --queue-num 0 2>/dev/null || iptables -A INPUT -p tcp -j NFQUEUE --queue-num 0;
             iptables -C OUTPUT -p tcp -j NFQUEUE --queue-num 0 2>/dev/null || iptables -A OUTPUT -p tcp -j NFQUEUE --queue-num 0;
             exec suricata -q 0 -S /rules/ips.rules -k none"

networks:
  lan:
    internal: true                      # réseau isolé : aucun accès à Internet
    driver_opts:
      com.docker.network.bridge.name: br-lab
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1